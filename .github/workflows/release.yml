name: Release

# Builds release binaries and publishes the GitHub Release with checksums.txt.
# Integrity comes from SHA-256 pins plus reproducible builds (no attestations:
# the repository is private and they would need GitHub Enterprise Cloud).
# See docs/RELEASING.md for the release process and how to verify a release.
#
# Supply-chain notes:
# - Every action is pinned to a full commit SHA (the comment gives the tag).
#   Bump them deliberately, after checking the upstream release.
# - The Go toolchain comes from go.mod (GOTOOLCHAIN=local: never auto-download
#   a different toolchain) and dependencies are read-only (-mod=readonly) and
#   checked against go.sum / sum.golang.org (go mod verify).
# - Tests run in a separate job that has a read-only token; the release job
#   only builds and publishes.

on:
  push:
    tags:
      - 'v*.*.*'

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: Verify and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify module checksums
        run: go mod verify

      - name: Check go.mod / go.sum are tidy
        run: |
          go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  goreleaser:
    name: Build and publish
    needs: test
    runs-on: ubuntu-24.04
    # Create a "release" environment in repo settings to add required
    # reviewers / restrict to protected tags. Without settings it is a no-op.
    environment: release
    permissions:
      contents: write      # create the GitHub Release and upload assets
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the changelog
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # No build cache in the release job: avoids cache poisoning.
          cache: false

      - name: Verify toolchain matches go.mod
        run: |
          go version && go env GOTOOLCHAIN GOFLAGS GOPROXY GOSUMDB
          want="$(awk '/^toolchain /{print $2}' go.mod)"
          got="$(go env GOVERSION)"
          if [ -n "$want" ] && [ "$got" != "$want" ]; then
            echo "::error::toolchain mismatch: go.mod wants $want, got $got"; exit 1
          fi

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Exact version; the action verifies the download against the
          # release's checksums.txt.
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
