version: 2

project_name: linear-cli

# Never mutate dependencies at release time (no `go mod tidy`): only check
# that the module cache matches go.sum. Tests run in a separate CI job with a
# read-only token (see .github/workflows/release.yml), so they are not run
# here where GITHUB_TOKEN is in the environment.
before:
  hooks:
    - go mod download
    - go mod verify

builds:
  - id: linear
    binary: linear
    main: ./cmd/linear
    env:
      - CGO_ENABLED=0
    # Reproducible builds: no local paths in the binary, and file mtimes
    # taken from the commit rather than the build time.
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/joa23/linear-cli/internal/cli.Version={{.Version}}

archives:
  - id: linear-cli
    ids:
      - linear
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      # Fixed metadata so archives are byte-for-byte reproducible.
      - src: README.md
        info:
          mtime: '{{ .CommitDate }}'
          owner: root
          group: root
          mode: 0644
      - src: LICENSE
        info:
          mtime: '{{ .CommitDate }}'
          owner: root
          group: root
          mode: 0644

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^build:'
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: 'Bug fixes'
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: Others
      order: 999

release:
  github:
    owner: Relynk
    name: linear-cli
  draft: false
  # Never auto-mark as prerelease, so Relynk suffixed tags such as
  # v1.12.0-relynk.1 are normal releases.
  prerelease: false
  mode: replace
  header: |
    ## Linear CLI {{.Tag}}

    A token-efficient CLI for Linear.

    ### Installation and verification

    Download the archive for your platform and `checksums.txt`, then:

    ```bash
    sha256sum --ignore-missing -c checksums.txt
    ```

    Pin the archive's SHA-256 in your container build. See docs/RELEASING.md
    for details and how to reproduce the build.

  footer: |
    **Full Changelog**: https://github.com/Relynk/linear-cli/compare/{{ .PreviousTag }}...{{ .Tag }}
